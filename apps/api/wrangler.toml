name = "kiloforge-api"
main = "src/index.ts"
compatibility_date = "2026-05-04"

[vars]
NODE_ENV = "production"
POSTHOG_HOST = "https://us.i.posthog.com"
PUBLIC_CORS_ORIGINS = ""

# After running `pnpm --filter @kiloforge/api run d1:create`, replace database_id.
[[d1_databases]]
binding = "DB"
database_name = "kiloforge"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
